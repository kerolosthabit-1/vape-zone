name: Supabase keep-alive

# الخطة المجانية في Supabase بتوقف المشروع بعد أسبوع من قلة النشاط.
# الـ workflow ده بيعمل طلب قراءة صغير مرتين يوميًا عشان المشروع يفضل صاحي.
# ملاحظة: GitHub بيوقف الـ scheduled workflows لو الريبو نفسه قعد 60 يوم بدون أي نشاط.
# لو ده حصل: Actions -> Supabase keep-alive -> Run workflow (يدوي)، أو اعمل أي push بسيط.

on:
  schedule:
    - cron: '17 3,15 * * *' # كل يوم الساعة 03:17 و 15:17 بتوقيت UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://rzzupcminrhzavfhanvb.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ6enVwY21pbnJoemF2ZmhhbnZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MzU1MDksImV4cCI6MjEwODAxMTUwOX0.XPe-oypQhN4ZCm7F02B5EQ29RZ5AxXfuRA2XZEubtwE' }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/shops?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          cat /tmp/out.json || true
          echo
          test "$code" = "200"
